<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        /* 关键CSS放在这里。其余的应该放在样式表中。 */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        body {
            background-color: rgb(36, 36, 37);
            background-image: url(https://qpay-onestroke-redpack-1251316161.cos.ap-guangzhou.myqcloud.com/664720315b5ee5a161c61f671fefce6d.png?imageMogr2/thumbnail/!50p);
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .card-key-container {
            background-color: rgba(50, 50, 50, 0.8);
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            width: 95%;
            max-width: 1200px;
            overflow: visible;
        }

        .card-key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-key-stats {
            display: flex;
            justify-content: space-around;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-total {
            color: #86e3ce;
        }

        .stat-used {
            color: #ff9999;
        }

        .stat-unused {
            color: #94c2ff;
        }

        .stat-label {
            font-size: 14px;
            color: #cccccc;
        }

        .card-key-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 15px;
        }

        .card-key-form label {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 5px;
            display: block;
        }

        .card-key-form input,
        .card-key-form select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            width: 100%;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .table-wrapper {
            width: 100%;
            max-height: 400px;
            overflow: auto;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .card-key-table {
            width: 100%;
            border-collapse: collapse;
            background-color: transparent;
            table-layout: fixed;
        }

        .card-key-table th,
        .card-key-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444;
            min-width: 120px;
        }

        .card-key-table thead {
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .card-key-table th {
            background-color: rgba(0, 0, 0, 0.5);
            color: #86e3ce;
            position: sticky;
            top: 0;
        }

        .card-key-table tr:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .status-unused {
            color: #94c2ff;
            font-weight: bold;
        }

        .status-used {
            color: #ff9999;
        }

        .action-button {
            background-color: transparent;
            border: none;
            color: #ff9999;
            cursor: pointer;
            font-size: 16px;
        }

        .action-button:hover {
            color: #ff6666;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 5px;
        }

        .pagination button {
            padding: 5px 10px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
            border-radius: 3px;
        }

        .pagination button.active {
            background-color: #86e3ce;
            color: #333;
        }

        .pagination button:hover:not(.active) {
            background-color: #444;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        .copy-button {
            background-color: transparent;
            border: none;
            color: #86e3ce;
            cursor: pointer;
            font-size: 14px;
            margin-left: 5px;
        }

        .copy-button:hover {
            color: #5dc2b5;
        }

        .copied {
            color: #5dc2b5;
        }

        /* 生成结果弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #333;
            padding: 20px;
            border-radius: 5px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-title {
            color: #86e3ce;
            margin: 0;
        }

        .close-button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .card-keys-list {
            background-color: #222;
            padding: 10px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }

        .card-keys-list code {
            display: block;
            margin-bottom: 5px;
            font-family: monospace;
        }

        .copy-all-button {
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #86e3ce;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .copy-all-button:hover {
            background-color: #5dc2b5;
        }

        .card-key-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-button {
            padding: 8px 15px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .filter-button.active {
            background-color: #86e3ce;
            color: #333;
            border-color: #86e3ce;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #86e3ce;
        }

        .error-message {
            background-color: rgba(255, 99, 99, 0.2);
            color: #ff9999;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        .success-message {
            background-color: rgba(134, 227, 206, 0.2);
            color: #86e3ce;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }

        .back-button:hover {
            background-color: #444;
        }

        /* 批量操作样式 */
        .bulk-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .bulk-action-button {
            padding: 8px 15px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bulk-action-button:hover:not(:disabled) {
            background-color: #444;
        }

        .bulk-action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #bulkDeleteButton {
            background-color: #ff4d4d;
            border-color: #ff4d4d;
        }

        #bulkDeleteButton:hover:not(:disabled) {
            background-color: #ff3333;
        }

        .check-column {
            width: 40px;
            text-align: center;
        }

        .check-column input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        /* 搜索和筛选样式 */
        .search-filter-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box {
            display: flex;
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        #searchInput {
            flex: 1;
            padding: 10px;
            padding-right: 40px;
            border: 1px solid #444;
            background-color: #222;
            color: white;
            border-radius: 4px;
        }

        .search-button {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 40px;
            background: none;
            border: none;
            color: #86e3ce;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-filter-button,
        .clear-filter-button {
            padding: 10px 15px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .toggle-filter-button:hover,
        .clear-filter-button:hover {
            background-color: #444;
        }

        .clear-filter-button {
            background-color: #444;
        }

        .advanced-filter-panel {
            width: 100%;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }

        .advanced-filter-panel.active {
            display: block;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        .filter-select {
            width: 100%;
            padding: 8px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        .date-range {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .date-input {
            flex: 1;
            padding: 8px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        .date-range span {
            color: #ccc;
        }

        .filter-buttons {
            display: flex;
            justify-content: flex-end;
        }

        .apply-filter-button {
            padding: 8px 15px;
            background-color: #86e3ce;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .apply-filter-button:hover {
            background-color: #5dc2b5;
        }

        /* 响应式样式 */
        @media screen and (max-width: 768px) {
            .card-key-container {
                width: 100%;
                margin: 10px 0;
                padding: 10px;
                border-radius: 0;
            }

            .table-wrapper {
                max-height: 300px;
            }

            .card-key-stats {
                flex-direction: column;
                gap: 10px;
            }

            .form-group {
                width: 100%;
            }

            .search-filter-container {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .filter-row {
                flex-direction: column;
                gap: 10px;
            }

            .date-range {
                flex-direction: column;
                align-items: stretch;
            }

            .date-range span {
                text-align: center;
                margin: 5px 0;
            }
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="css/st-tailwind.css">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <!-- fontawesome webfonts-->
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <link href="css/user.css" rel="stylesheet">
    <script src="scripts/cardkeys.js"></script>
    <title>咸鱼傻酒馆 - 卡密管理</title>
</head>

<body style="display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding-bottom: 50px;">
    <div class="card-key-container">
        <div class="card-key-header">
            <h1>卡密管理</h1>
        </div>

        <div id="errorMessage" class="error-message hidden"></div>
        <div id="successMessage" class="success-message hidden"></div>

        <div class="card-key-stats" id="cardKeyStats">
            <div class="stat-item">
                <div class="stat-value stat-total" id="totalCount">0</div>
                <div class="stat-label">总卡密数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value stat-unused" id="unusedCount">0</div>
                <div class="stat-label">未使用</div>
            </div>
            <div class="stat-item">
                <div class="stat-value stat-used" id="usedCount">0</div>
                <div class="stat-label">已使用</div>
            </div>
        </div>

        <div class="card-key-form">
            <div class="form-group">
                <label for="batchName">批次名称</label>
                <input type="text" id="batchName" placeholder="例如: 首批测试卡密">
            </div>
            <div class="form-group">
                <label for="count">生成数量</label>
                <input type="number" id="count" min="1" max="100" value="10">
            </div>
            <div class="form-buttons">
                <button type="button" id="generateButton" class="menu_button">生成卡密</button>
            </div>
        </div>

        <!-- 搜索和筛选区域 -->
        <div class="search-filter-container">
            <!-- 搜索框 -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索卡密或使用者...">
                <button type="button" id="searchButton" class="search-button">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>

            <!-- 高级筛选按钮 -->
            <button type="button" id="toggleAdvancedFilter" class="toggle-filter-button">
                高级筛选 <i class="fa-solid fa-chevron-down"></i>
            </button>

            <!-- 清除筛选按钮 -->
            <button type="button" id="clearFilterButton" class="clear-filter-button">
                清除筛选
            </button>
        </div>

        <!-- 高级筛选面板 -->
        <div id="advancedFilterPanel" class="advanced-filter-panel">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="batchFilter">批次筛选</label>
                    <select id="batchFilter" class="filter-select">
                        <option value="">全部批次</option>
                        <!-- 批次选项将通过JS动态加载 -->
                    </select>
                </div>

                <div class="filter-group">
                    <label>创建时间范围</label>
                    <div class="date-range">
                        <input type="date" id="createDateStart" class="date-input">
                        <span>至</span>
                        <input type="date" id="createDateEnd" class="date-input">
                    </div>
                </div>

                <div class="filter-group">
                    <label>使用时间范围</label>
                    <div class="date-range">
                        <input type="date" id="useDateStart" class="date-input">
                        <span>至</span>
                        <input type="date" id="useDateEnd" class="date-input">
                    </div>
                </div>
            </div>

            <div class="filter-buttons">
                <button type="button" id="applyFilterButton" class="apply-filter-button">应用筛选</button>
            </div>
        </div>

        <div class="card-key-filters">
            <button type="button" class="filter-button active" data-status="all">全部</button>
            <button type="button" class="filter-button" data-status="unused">未使用</button>
            <button type="button" class="filter-button" data-status="used">已使用</button>
        </div>

        <div id="loadingMessage" class="loading hidden">加载中...</div>

        <!-- 批量操作按钮 -->
        <div class="bulk-actions">
            <button type="button" id="bulkDeleteButton" class="bulk-action-button" disabled>
                <i class="fa-solid fa-trash"></i> 批量删除选中卡密 (<span id="selectedCount">0</span>)
            </button>
            <button type="button" id="selectAllCurrentButton" class="bulk-action-button">
                选择当前页所有卡密
            </button>
            <button type="button" id="selectAllFilteredButton" class="bulk-action-button">
                选择所有筛选结果
            </button>
            <button type="button" id="deselectAllButton" class="bulk-action-button" disabled>
                取消所有选择
            </button>
        </div>

        <div class="table-wrapper">
            <table class="card-key-table">
                <thead>
                    <tr>
                        <th class="check-column">
                            <input type="checkbox" id="selectAllCheckbox" title="选择/取消选择所有">
                        </th>
                        <th>卡密</th>
                        <th>批次名称</th>
                        <th>创建时间</th>
                        <th>状态</th>
                        <th>使用者</th>
                        <th>使用时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="cardKeyTableBody">
                    <!-- 卡密数据将在这里动态加载 -->
                </tbody>
            </table>
        </div>

        <div id="emptyMessage" class="empty-message hidden">暂无卡密数据</div>

        <div class="pagination" id="pagination">
            <!-- 分页控件将在这里动态加载 -->
        </div>

        <button type="button" class="back-button" onclick="window.location.href='/'">返回主页</button>
    </div>

    <!-- 生成结果弹窗 -->
    <div id="generatedModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">卡密生成成功</h2>
                <button class="close-button" id="closeModal">&times;</button>
            </div>
            <p>已生成以下卡密：</p>
            <div class="card-keys-list" id="generatedCardKeys">
                <!-- 生成的卡密将在这里显示 -->
            </div>
            <button class="copy-all-button" id="copyAllButton">复制全部卡密</button>
        </div>
    </div>
</body>

</html>
